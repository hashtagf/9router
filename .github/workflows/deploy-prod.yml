# Deploy the 9Router fork to production (router9-vm on GCP).
#
# Flow: push to master → Cloud Build builds the image, tagged router-<sha> AND
# :prod → SSH over IAP restarts 9router.service on the VM, whose ExecStartPre
# re-pulls :prod → health check.
#
# Auth is keyless (Workload Identity Federation); infra lives in
# 9router-terraform/cicd.tf. Rollback: retag an older router-<sha> as :prod
#   gcloud artifacts docker tags add $GAR/9router:router-<old> $GAR/9router:prod
# then restart 9router.service (or re-run with build=false).

name: Deploy to production

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "gitbook/**"
      - "tests/**"
      - ".github/**"
      - "!.github/workflows/deploy-prod.yml"
  workflow_dispatch:
    inputs:
      build:
        description: "Build a new image (false = restart on the current :prod)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PROJECT: k8s-ms-381210
  REGION: asia-southeast1
  GAR: asia-southeast1-docker.pkg.dev/k8s-ms-381210/onyx
  WIF_PROVIDER: projects/695151832977/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  DEPLOYER_SA: github-deployer@k8s-ms-381210.iam.gserviceaccount.com
  VM: router9-vm
  ZONE: asia-southeast1-a
  HEALTH_URL: https://9router.claude-foundation.dev/api/health

jobs:
  build:
    if: github.event_name == 'push' || inputs.build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Build image on Cloud Build
        run: |
          TAG="router-$(git rev-parse --short HEAD)"
          # --async + describe-polling: streaming logs from `builds submit`
          # is flaky from WIF-federated credentials and can fail the step
          # while the build itself succeeds.
          BUILD_ID=$(gcloud builds submit . --async \
            --project="$PROJECT" --region="$REGION" \
            --machine-type=e2-highcpu-8 --timeout=3600s \
            --format="value(id)" \
            --config=/dev/stdin <<EOF
          steps:
          - name: gcr.io/cloud-builders/docker
            env: [DOCKER_BUILDKIT=1]
            args: [build, -t, $GAR/9router:$TAG, -t, $GAR/9router:prod, .]
          images: [$GAR/9router:$TAG, $GAR/9router:prod]
          EOF
          )
          echo "Build: https://console.cloud.google.com/cloud-build/builds;region=$REGION/$BUILD_ID?project=$PROJECT"
          while :; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="$PROJECT" --region="$REGION" --format="value(status)")
            echo "status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 30
          done

  deploy:
    needs: build
    # Also runs when build was skipped (workflow_dispatch with build=false).
    if: "!cancelled() && needs.build.result != 'failure'"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Restart 9router (re-pulls :prod)
        run: |
          # First OS Login connection can race key propagation; retry.
          for i in 1 2 3; do
            gcloud compute ssh "$VM" --zone="$ZONE" --project="$PROJECT" \
              --tunnel-through-iap --quiet \
              --command "sudo systemctl restart 9router" && exit 0
            echo "ssh attempt $i failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Health check
        run: |
          echo "Waiting for $HEALTH_URL"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after $((i*10))s"
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1
